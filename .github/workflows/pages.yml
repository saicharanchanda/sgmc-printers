# Temporary preview on GitHub Pages (served at /<repo>/). Final hosting: Netlify / Cloudflare.
# Builds the designs side by side: main at /<repo>/, design-v2 at /<repo>/v2/, design-v3 at /<repo>/v3/.
# Pushes to design-v2 / design-v3 re-run this via the redeploy workflow on those branches.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: site-main }
      - uses: actions/checkout@v4
        with: { ref: design-v2, path: site-v2 }
      - uses: actions/checkout@v4
        with: { ref: design-v3, path: site-v3 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site-*/package-lock.json
      - name: Build main design
        working-directory: site-main
        env: { BASE_PATH: '/${{ github.event.repository.name }}' }
        run: npm ci && npm run build && node scripts/apply-base.mjs
      - name: Build v2 design
        working-directory: site-v2
        env: { BASE_PATH: '/${{ github.event.repository.name }}/v2' }
        run: npm ci && npm run build && node scripts/apply-base.mjs
      - name: Build v3 design
        working-directory: site-v3
        env: { BASE_PATH: '/${{ github.event.repository.name }}/v3' }
        run: npm ci && npm run build && node scripts/apply-base.mjs
      - run: cp -r site-main/dist out && cp -r site-v2/dist out/v2 && cp -r site-v3/dist out/v3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
